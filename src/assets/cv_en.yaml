cv:
  name: Martin Cogo Belver
  location: Godoy Cruz, Mendoza, Argentina
  email: martincogo3@gmail.com
  website: "https://mrtc101.github.io/MrtC101/"
  headline: Computer Vision Engineer | Real-Time Video Perception & Edge AI
  social_networks:
    - network: LinkedIn
      username: martin-cogo
    - network: GitHub
      username: MrtC101

  sections:
    summary:
      - "Engineer specialized in real-time video perception: I design and implement inference pipelines over GStreamer, GPU-accelerated with CUDA, processing RTSP video streams in production. I work with PyTorch, YOLO, and CUDA-accelerated OpenCV for live object detection, optimizing pipeline stages (GPU decoding, inference, zero-copy transfer) for 24/7 systems. Computer Science background (UNCUYO), with a thesis on satellite image segmentation using Deep Learning. Looking for Computer Vision / Perception Engineer roles focused on real-time video systems and edge deployment (Jetson, embedded)."

    experience:
      - company: "[MindColab](https://mindcolab.com/)"
        position: Computer Vision Software Engineer
        start_date: 2025-07
        end_date: present
        logo: mindcolab_logo
        gallery: mindcolab
        stack: "Tailwind, React, TypeScript, Bun, FastAPI, PyTorch, Ultralytics, Anomalib, OpenCV, CUDA, GStreamer, Python, SQLite, Redis, Docker, Linux"
        summary: >
          Designed and implemented a real-time inference engine built on GStreamer pipelines,
          capable of processing multiple parallel RTSP streams with low latency under load.
          The system follows a multi-process architecture with shared-memory IPC
          to minimize unnecessary copies and reduce end-to-end latency.
        highlights:
          - "**Flow control**: Implemented backpressure handling using GStreamer queues to sustain stable throughput under concurrent load."
          - "**Acceleration stack**: GPU-based implementation leveraging GStreamer NVIDIA plugins, NVMM buffers, CUDA kernels (Numba), and CUDA-enabled OpenCV for preprocessing."
          - "**Inference optimization**: Executed YOLO/PyTorch models with frames kept predominantly on GPU, reducing CPU↔GPU transfer overhead."
          - "**Lifecycle & operations**: Supported controlled restarts, hot configuration reloads via a custom DSL, and graceful shutdowns in 24/7 environments."
          - "**Observability**: Measured per-stage pipeline latency and monitored GPU, VRAM, RAM, and CPU utilization under sustained load."
          - "**Technical impact**: Migrated from a CPU-bound solution to GPU acceleration, enabling real-time stream retransmission where it was previously not feasible."

      - company: "[Municipality of Godoy Cruz](https://www.godoycruz.gob.ar/)"
        position: Web Developer
        start_date: 2025-06
        end_date: 2026-09
        logo: municipalidad_de_godoy_cruz_logo
        stack: "GeneXus, Java, Tomcat, Nginx, React, Tailwind, Bun"
        summary: >
          Maintain and extend a legacy GeneXus-generated Java web application for municipal
          debt and tax payments, including refactoring integrations with multiple banking
          payment gateways, and building an internal LLM-based chat interface for semantic
          querying of municipal regulations.
        highlights:
          - "**Legacy maintenance**: Maintain and resolve tickets on a GeneXus-generated Java codebase, within the municipal debt and tax payment module."
          - "**Payment integrations**: Refactored integrations with multiple banking payment gateway APIs (Banco Macro, Mercado Pago, ePagos, XNet, Pago Fácil, Supervielle) in the transaction and amount-submission flow."
          - "**LLM chat interface**: Built an internal web chat interface for semantic querying of municipal regulations via an LLM."
          - "[View Project](https://github.com/MrtC101/digesto-semantic-chat)"

      - company: "[Klari Inc.](https://klari.ai/)"
        position: Data Scientist (Internship, 200 hrs)
        start_date: 2025-01
        end_date: 2025-02
        logo: klariai_logo
        stack: "Python, NumPy, Pandas, Scikit-learn, PyTorch, TensorFlow, OpenCV, Ultralytics, Anomalib, Numba, FastAPI, MongoDB"
        summary: >
          Designed and implemented a semantic analysis system for conversations generated by an LLM-based chatbot,
          aimed at extracting thematic patterns and producing actionable reports on user behavior
          and interaction quality.
        highlights:
          - "**NLP pipeline**: Semantic representation of conversations using embeddings."
          - "**Thematic analysis**: Unsupervised clustering to extract conversational patterns."

      - company: "[CICDa Research Group](https://sites.google.com/view/cicda/home)"
        position: Undergraduate Thesis Researcher
        start_date: 2024-01
        end_date: 2025-01
        logo: facultad_de_ingenieria_uncuyo_logo
        stack: "JavaScript, Python, PyTorch, Pandas, Scikit-learn, Linux, Git, OpenCV"
        summary: >
          Conducted undergraduate thesis research focused on satellite image segmentation
          for post-disaster building damage detection and estimation, using temporal image comparison
          and Siamese deep learning architectures.
        highlights:
          - "**xBD dataset**: Trained on ~2,400 VHR satellite images for Building Damage Assessment tasks."
          - "**End-to-end pipeline**: Preprocessing, training, inference, and post-processing for semantic segmentation and multitemporal structural change detection."
          - "**Computer vision modeling**: Trained deep learning models for post-disaster building semantic segmentation."
          - "**Experimental evaluation**: Quantitative analysis using classification and segmentation metrics (Precision, Recall, F1-score)."
          - "**Compute**: Training executed on a High Performance Computing cluster with NVIDIA Tesla V100 GPUs."
          - "[View Project](https://github.com/MrtC101/Thesis_DL_for_BDA) · [View Thesis (in Spanish)](https://bdigital.uncu.edu.ar/fichas.php?idobjeto=20482)"

    technical_skills:
      - label: Programming Languages
        key: languages
        details: Python, TypeScript, C++, Rust
      - label: AI & ML
        details: PyTorch, Scikit-learn, Ultralytics, Anomalib
      - label: Vision & Data
        details: OpenCV, CUDA, GStreamer, Pandas, NumPy
      - label: Backend, REST APIs & Web
        details: FastAPI, Nginx, React, Tailwind, Bun
      - label: Databases
        details: SQLite, Redis, MongoDB
      - label: DevOps & Tools
        details: Docker, Linux, Git

    education:
      - institution: National University of Cuyo
        area: Bachelor of Computer Science
        study_type: Undergraduate Degree (GPA 8.7/10)
        start_date: 2020
        end_date: 2024
        logo: facultad_de_ingenieria_uncuyo_logo

    awards:
      - bullet: "Highest GPA (8.7 on a ten-point scale) in the Computer Science program, Class of 2024."
      - bullet: "Ranked among the top 15 engineering students at UNCUYO (2024), based on academic GPA."

    languages:
      - bullet: "Spanish: Native."
      - bullet: "English: Upper-Intermediate (B2), Cambridge certified."

design:
  theme: classic
  sections:
    show_time_spans_in: []
    space_between_regular_entries: 0.55cm
  page:
