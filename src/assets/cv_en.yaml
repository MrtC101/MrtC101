# yaml-language-server: $schema=https://raw.githubusercontent.com/rendercv/rendercv/refs/tags/v2.5/schema.json
cv:
  name: Martín Cogo
  location: Godoy Cruz, Mendoza, Argentina
  email: martincogo3@gmail.com
  website: "https://mrtc101.github.io/MrtC101/"
  headline: Computer Vision Engineer | Real-Time Video Perception & Edge AI
  social_networks:
    - network: LinkedIn
      username: martin-cogo
    - network: GitHub
      username: MrtC101

  sections:
    summary:
      - "I build real-time computer vision systems on NVIDIA GPUs: GStreamer/DeepStream pipelines running TensorRT models on live RTSP cameras, with per-stage telemetry to measure and optimize latency. At MindColab I cut a live pipeline's latency from ~1.1 s to ~39 ms and authored 98% of the commits of a 12-component edge platform. Computer Science graduate (UNCUYO) with the highest GPA of the 2024 class. Looking for Computer Vision / Perception Engineer roles."

    experience:
      - company: "[MindColab](https://mindcolab.com/)"
        position: Computer Vision Software Engineer (Part-time)
        start_date: 2025-07
        end_date: present
        logo: mindcolab_logo
        gallery: mindcolab
        stack: "Python, GStreamer, DeepStream, TensorRT, CUDA, PyTorch, ONNX, Anomalib, Ultralytics, OpenCV, FastAPI, ZMQ, Redis, React, Docker, k3s, Helm"
        summary: >
          Real-time inference engine and edge platform for visual inspection of mining conveyor belts.
          It processes multiple live RTSP cameras with GStreamer/DeepStream and TensorRT, keeping
          frames in GPU memory (NVMM).
        highlights:
          - "**Latency**: Cut live pipeline latency from ~1.1 s to ~39 ms mean (~28×; 76 ms p99 against a 200 ms frame budget) and frame loss from 17.9% to 0.11% in steady state. I removed two hidden waits that my telemetry exposed: an encoder blocking upstream threads and publisher clock sync."
          - "**Per-stage telemetry**: Designed and built the engine's telemetry: 48 timing buckets per job, probes on every GStreamer element, GPU timings via CUDA events, mergeable log histograms (p50/p95/p99) in 5 s windows, and a REST API with GPU, CPU and RAM metrics."
          - "**Models**: Runs 2 TensorRT FP16 models per frame: DINOv2-small detects foreign objects (anomaly detection) and FastSAM-s segments rocks and measures their size. Compared Dinomaly and EfficientAD, and validated ONNX and TensorRT exports against the original PyTorch checkpoint."
          - "**24/7 operation**: Self-healing workers: 8 automatic restarts in ~1 h after upstream RTSP source drops, each back in 34–36 s with no manual action. Controlled restarts, config hot-reload through a custom DSL, and graceful shutdown."
          - "**Platform**: Main author (98% of 2,717 commits) of a 12-component edge platform: FastAPI microservices, ZMQ, Redis, a React SPA with live WebRTC video, and centralized logging (Fluent Bit + VictoriaLogs), deployed with k3s + Helm for NVIDIA Jetson."

      - company: "[Municipality of Godoy Cruz](https://www.godoycruz.gob.ar/)"
        position: Web Developer (Part-time)
        start_date: 2025-06
        end_date: 2026-09
        logo: municipalidad_de_godoy_cruz_logo
        stack: "Java, GeneXus, Tomcat, Nginx, React, Tailwind, Bun"
        summary: >
          Maintained and extended the municipal debt and tax payment web application
          (GeneXus-generated Java).
        highlights:
          - "**Payment integrations**: Refactored integrations with 6 banking payment gateways (Banco Macro, Mercado Pago, ePagos, XNet, Pago Fácil, Supervielle) in the amount and transaction submission flow."
          - "**LLM chat**: Built an internal chat interface to query municipal regulations through semantic search and an LLM ([view project](https://github.com/MrtC101/digesto-semantic-chat))."

      - company: "[Klari Inc.](https://klari.ai/)"
        position: Data Scientist (Internship, 200 hrs)
        start_date: 2025-01
        end_date: 2025-02
        logo: klariai_logo
        stack: "Python, NumPy, Pandas, Scikit-learn, PyTorch, FastAPI, MongoDB"
        summary: >
          Semantic analysis of conversations from an LLM-based chatbot, with reports on
          interaction quality.
        highlights:
          - "**NLP pipeline**: Conversation embeddings and unsupervised clustering to detect recurring topics."

      - company: "[CICDa Research Group](https://sites.google.com/view/cicda/home)"
        position: Undergraduate Thesis Researcher
        start_date: 2024-01
        end_date: 2025-01
        logo: facultad_de_ingenieria_uncuyo_logo
        stack: "Python, PyTorch, Pandas, Scikit-learn, OpenCV, Linux, Git"
        summary: >
          Thesis on post-disaster building damage assessment from satellite imagery: a multitask
          Siamese U-Net that segments buildings and classifies damage into 4 levels from pre- and
          post-disaster images ([code](https://github.com/MrtC101/Thesis_DL_for_BDA)
          · [thesis, in Spanish](https://bdigital.uncu.edu.ar/fichas.php?idobjeto=20482)).
        highlights:
          - "**End-to-end pipeline**: Preprocessing, training, inference and post-processing on ~3,000 VHR satellite images from the xBD dataset, with a custom greedy sampling strategy to balance damage classes."
          - "**Results**: 0.80 F1 for building segmentation on the test split, with pixel- and object-level evaluation."
          - "**Compute**: Trained on an HPC cluster with NVIDIA Tesla V100 GPUs."

    technical_skills:
      - label: Programming Languages
        key: languages
        details: Python, TypeScript/JavaScript, C/C++
      - label: Computer Vision & Inference
        details: GStreamer, DeepStream, TensorRT, CUDA, ONNX, OpenCV
      - label: AI & ML
        details: PyTorch, Ultralytics, Anomalib, Scikit-learn, Pandas, NumPy
      - label: Backend, REST APIs & Web
        details: FastAPI, ZMQ, Nginx, React, Tailwind
      - label: Databases
        details: Redis, SQLite, MongoDB
      - label: DevOps & Tools
        details: Docker, k3s, Helm, Linux, Git

    education:
      - institution: National University of Cuyo
        area: Bachelor of Computer Science
        study_type: Undergraduate Degree (GPA 8.7/10)
        start_date: 2020
        end_date: 2024
        logo: facultad_de_ingenieria_uncuyo_logo

    awards:
      - bullet: "Highest GPA (8.7 on a ten-point scale) in the Computer Science program, Class of 2024."
      - bullet: "Faculty of Engineering honor roll (top 15 GPAs), UNCUYO, 2024."

    languages:
      - bullet: "Spanish: Native."
      - bullet: "English: Upper-Intermediate (B2), Cambridge certified."

design:
  theme: classic
  sections:
    show_time_spans_in: []
    space_between_regular_entries: 0.55cm

  # Dates live in the main column (see templates), so the right-hand
  # date/location column is always empty: give its width back to the text.
  entries:
    date_and_location_width: 0cm
    space_between_columns: 0cm

  page:
    show_footer: false
    show_top_note: false
    top_margin: 1.2cm
    bottom_margin: 1.2cm
    left_margin: 1.3cm
    right_margin: 1.2cm

  templates:
    experience_entry:
      main_column: "**COMPANY**\nPOSITION\nDATE\nSUMMARY\nHIGHLIGHTS\n*Stack: STACK*"
      date_and_location_column: ""
    education_entry:
      main_column: "**INSTITUTION**\nAREA, STUDY_TYPE\nDATE\nSUMMARY\nHIGHLIGHTS"
      date_and_location_column: ""
      degree_column: null

  header:
    alignment: left
    connections:
      show_icons: false
      separator: " | "
      display_urls_instead_of_usernames: true
    photo_width: 2.8cm
    photo_position: right
    space_below_name: 0.35cm

  typography:
      line_spacing: 0.7em
      alignment: left
      date_and_location_column_alignment: right
      font_family:
        body: Source Sans 3
        name: Source Sans 3
        headline: Source Sans 3
        connections: Source Sans 3
        section_titles: Source Sans 3
      font_size:
        body: 10pt
        name: 28pt
        headline: 10pt
        connections: 9.5pt
        section_titles: 1.25em
      small_caps:
        name: false
        headline: false
        connections: false
        section_titles: false
      bold:
        name: true
        headline: false
        connections: false
        section_titles: true

  section_titles:
    type: with_partial_line
    space_above: 0.45cm
    space_below: 0.25cm

locale:
  language: english
