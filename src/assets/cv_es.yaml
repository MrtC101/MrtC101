# yaml-language-server: $schema=https://raw.githubusercontent.com/rendercv/rendercv/refs/tags/v2.5/schema.json
cv:
  name: Martín Cogo
  location: Godoy Cruz, Mendoza, Argentina
  email: martincogo3@gmail.com
  website: "https://mrtc101.github.io/MrtC101/"
  headline: Computer Vision Engineer | Percepción visual en tiempo real y Edge AI
  #photo: picture.jfif
  social_networks:
    - network: LinkedIn
      username: martin-cogo
    - network: GitHub
      username: MrtC101

  sections:
    resumen:
      - "Desarrollo sistemas de visión por computadora en tiempo real sobre GPU NVIDIA: pipelines GStreamer/DeepStream que corren modelos TensorRT sobre cámaras RTSP en vivo, con telemetría por etapas para medir y optimizar la latencia. En MindColab bajé la latencia de un pipeline en vivo de ~1,1 s a ~39 ms y soy autor del 98% de los commits de una plataforma edge de 12 componentes. Licenciado en Ciencias de la Computación (UNCUYO), mejor promedio de la promoción 2024. Busco roles de Computer Vision / Perception Engineer."

    experiencia_laboral:
      - company: "[MindColab](https://mindcolab.com/)"
        position: Computer Vision Software Engineer (Part-time)
        start_date: 2025-07
        end_date: present
        logo: mindcolab_logo
        gallery: mindcolab
        stack: "Python, GStreamer, DeepStream, TensorRT, CUDA, PyTorch, ONNX, Anomalib, Ultralytics, OpenCV, FastAPI, ZMQ, Redis, React, Docker, k3s, Helm"
        summary: >
          Motor de inferencia en tiempo real y plataforma edge para la inspección visual de cintas
          transportadoras en minería. Procesa varias cámaras RTSP en vivo con GStreamer/DeepStream
          y TensorRT, con los frames en memoria de GPU (NVMM).
        highlights:
          - "**Latencia**: Bajé la latencia del pipeline en vivo de ~1,1 s a ~39 ms de media (~28×; p99 de 76 ms frente a un presupuesto de 200 ms por frame) y la pérdida de frames de 17,9% a 0,11% en régimen estable. Quité dos esperas ocultas que expuso mi telemetría: un encoder que bloqueaba los hilos de arriba y la sincronización de reloj del publisher."
          - "**Telemetría por etapas**: Diseñé e implementé la telemetría del motor: 48 métricas de tiempo por job, probes en cada elemento GStreamer, tiempos de GPU con eventos CUDA, histogramas logarítmicos fusionables (p50/p95/p99) en ventanas de 5 s y una API REST con métricas de GPU, CPU y RAM."
          - "**Modelos**: 2 modelos TensorRT FP16 por frame: DINOv2-small detecta objetos extraños (anomalías) y FastSAM-s segmenta rocas y mide su tamaño. Comparé Dinomaly y EfficientAD, y validé las exportaciones a ONNX y TensorRT contra el checkpoint original de PyTorch."
          - "**Operación 24/7**: Workers que se recuperan solos: 8 reinicios automáticos en ~1 h ante caídas de la fuente RTSP, cada uno en 34–36 s y sin intervención manual. Restart controlado, hot-reload de configuración con un DSL propio y graceful shutdown."
          - "**Plataforma**: Autor principal (98% de 2717 commits) de una plataforma edge de 12 componentes: microservicios FastAPI, ZMQ, Redis, una SPA en React con video WebRTC en vivo y logs centralizados (Fluent Bit + VictoriaLogs), desplegada con k3s y Helm para NVIDIA Jetson."

      - company: "[Municipalidad de Godoy Cruz](https://www.godoycruz.gob.ar/)"
        position: Desarrollador Web (Part-time)
        start_date: 2025-06
        end_date: 2026-09
        logo: municipalidad_de_godoy_cruz_logo
        stack: "Java, GeneXus, Tomcat, Nginx, React, Tailwind, Bun"
        summary: >
          Mantenimiento y extensión de la aplicación web de pago de deudas y tasas municipales
          (Java generado con GeneXus).
        highlights:
          - "**Integraciones de pago**: Refactoricé las integraciones con 6 pasarelas de pago bancarias (Banco Macro, Mercado Pago, ePagos, XNet, Pago Fácil, Supervielle) en el flujo de envío de montos y transacciones."
          - "**Chat con LLM**: Desarrollé una interfaz de chat interna para consultar normativas municipales mediante búsqueda semántica y un LLM ([ver proyecto](https://github.com/MrtC101/digesto-semantic-chat))."

      - company: "[Klari Inc.](https://klari.ai/)"
        position: Científico de Datos (Pasantía, 200 hs)
        start_date: 2025-01
        end_date: 2025-02
        logo: klariai_logo
        stack: "Python, NumPy, Pandas, Scikit-learn, PyTorch, FastAPI, MongoDB"
        summary: >
          Análisis semántico de las conversaciones de un chatbot basado en LLM, con reportes sobre
          la calidad de la interacción.
        highlights:
          - "**Pipeline NLP**: Embeddings de las conversaciones y clustering no supervisado para detectar temas recurrentes."

      - company: "[Grupo CICDa](https://sites.google.com/view/cicda/home)"
        position: Investigador de Tesis de Grado
        start_date: 2024-01
        end_date: 2025-01
        logo: facultad_de_ingenieria_uncuyo_logo
        stack: "Python, PyTorch, Pandas, Scikit-learn, OpenCV, Linux, Git"
        summary: >
          Tesis sobre evaluación de daños en edificios tras desastres naturales con imágenes satelitales:
          una U-Net siamesa multitarea que segmenta edificios y clasifica su daño en 4 niveles a partir
          de imágenes previas y posteriores al desastre ([código](https://github.com/MrtC101/Thesis_DL_for_BDA)
          · [tesis](https://bdigital.uncu.edu.ar/fichas.php?idobjeto=20482)).
        highlights:
          - "**Pipeline completo**: Preprocesamiento, entrenamiento, inferencia y post-procesamiento sobre ~3000 imágenes satelitales VHR del dataset xBD, con una estrategia propia de muestreo greedy para balancear las clases de daño."
          - "**Resultados**: F1 de 0,80 en segmentación de edificios sobre el conjunto de test, con evaluación a nivel de píxel y de objeto."
          - "**Cómputo**: Entrenamiento en un clúster HPC con GPUs NVIDIA Tesla V100."

    habilidades_técnicas:
      - label: Lenguajes
        key: languages
        details: Python, TypeScript/JavaScript, C/C++
      - label: Visión e Inferencia
        details: GStreamer, DeepStream, TensorRT, CUDA, ONNX, OpenCV
      - label: IA & ML
        details: PyTorch, Ultralytics, Anomalib, Scikit-learn, Pandas, NumPy
      - label: Backend, APIs REST y Web
        details: FastAPI, ZMQ, Nginx, React, Tailwind
      - label: Bases de Datos
        details: Redis, SQLite, MongoDB
      - label: DevOps y Herramientas
        details: Docker, k3s, Helm, Linux, Git

    educación:
      - institution: Universidad Nacional de Cuyo
        area: Licenciatura en Ciencias de la Computación
        study_type: Grado (Promedio 8,7)
        start_date: 2020
        end_date: 2024
        logo: facultad_de_ingenieria_uncuyo_logo

    premios:
      - bullet: "Medalla al mejor promedio de la promoción 2024 de la Licenciatura en Ciencias de la Computación."
      - bullet: "Cuadro de honor (top 15 promedios) de la Facultad de Ingeniería, UNCUYO, 2024."

    idiomas:
      - bullet: "Español: Nativo."
      - bullet: "Inglés: Nivel B2 (Certificado por Cambridge)."

design:
  theme: classic
  sections:
    show_time_spans_in: []
    space_between_regular_entries: 0.55cm

  # Dates live in the main column (see templates), so the right-hand
  # date/location column is always empty: give its width back to the text.
  entries:
    date_and_location_width: 0cm
    space_between_columns: 0cm

  page:
    show_footer: false
    show_top_note: false
    top_margin: 1.2cm
    bottom_margin: 1.2cm
    left_margin: 1.3cm
    right_margin: 1.2cm

  templates:
    experience_entry:
      main_column: "**COMPANY**\nPOSITION\nDATE\nSUMMARY\nHIGHLIGHTS\n*Stack: STACK*"
      date_and_location_column: ""
    education_entry:
      main_column: "**INSTITUTION**\nAREA, STUDY_TYPE\nDATE\nSUMMARY\nHIGHLIGHTS"
      date_and_location_column: ""
      degree_column: null

  header:
    alignment: left
    connections:
      show_icons: false
      separator: " | "
      display_urls_instead_of_usernames: true
    photo_width: 2.8cm
    photo_position: right
    space_below_name: 0.35cm

  typography:
      line_spacing: 0.7em
      alignment: left
      date_and_location_column_alignment: right
      font_family:
        body: Source Sans 3
        name: Source Sans 3
        headline: Source Sans 3
        connections: Source Sans 3
        section_titles: Source Sans 3
      font_size:
        body: 10pt
        name: 28pt
        headline: 10pt
        connections: 9.5pt
        section_titles: 1.25em
      small_caps:
        name: false
        headline: false
        connections: false
        section_titles: false
      bold:
        name: true
        headline: false
        connections: false
        section_titles: true

  section_titles:
    type: with_partial_line
    space_above: 0.45cm
    space_below: 0.25cm

locale:
  language: spanish
